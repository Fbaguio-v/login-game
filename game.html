<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="game.css">
    <script src="game.js" defer></script>
</head>
<body>
    <div class="container">
        <form>
            <div>
                <label for="for_username">Username</label>
                <input type="text" name="for_username" id="for_username" placeholder="your username">
            </div>
            <div>
                <label for="for_password">Password</label>
                <input type="password" name="for_password" id="for_password" placeholder="your password">
            </div>
            <button type="submit">Continue</button>
        </form>
        <canvas id="canvas"></canvas>
    </div>
</body>
</html>
